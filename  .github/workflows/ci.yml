name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile agent.py app.py
      - run: python3 agent.py --task "add 12 30 8"
      - run: docker build -t mcp-tool-agent .